name: Deploy Astro App to Firebase Hosting

on:
  push:
    branches:
      - main
  schedule:
    # Runs daily at 12:00 AM Jerusalem time (21:00 UTC during DST, 22:00 UTC during standard time)
    # Using 21:00 UTC to align with Jerusalem DST (UTC+3) which is observed most of the year
    - cron: "0 21 * * *"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Specify the version of Node.js your Astro app requires
          cache: "yarn"

      # Install dependencies
      - name: Install dependencies
        run: yarn install

      # Install settimezone
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Asia/Jerusalem

      # Build the Astro app
      - name: Build the Astro app
        run: yarn build

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: yarn global add firebase-tools

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy
